name: US Sniper Cloud Monitor (AMD / AVGO / SOXX / NVDA)

on:
  schedule:
    # 美股冬令盤中時段 (台灣時間 22:30 ~ 05:00 = UTC 14:30 ~ 21:00，週一至週五/六清晨)
    - cron: '30-59/5 14 * * 1-5'
    - cron: '*/5 15-20 * * 1-5'
    - cron: '0-10/5 21 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sniper-watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Run US Sniper Monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '7660257976' }}
        run: |
          python us_sniper_monitor.py

      - name: Commit Alert State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/us_sniper_state.json || true
          git diff --cached --quiet || (git commit -m "chore(sniper): update US sniper alert state [skip ci]" && git push origin main)
