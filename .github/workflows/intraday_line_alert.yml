name: Intraday LINE Sweet-Spot Alert (顏老師鐵律盤中推播)

on:
  schedule:
    # 台灣時間 09:00 ~ 13:30 (UTC 01:00 ~ 05:30) 每 15 分鐘執行一次
    - cron: '0,15,30,45 1,2,3,4 * * 1-5'
    - cron: '0,15,30 5 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁隨時手動點擊執行

jobs:
  check-and-alert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests pandas

      - name: Run Intraday LINE Sweet-Spot Checker
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python line_intraday_pusher.py --once

      - name: Commit Alert State (Prevent Repeated Push)
        run: |
          git config --global user.name "Quant-Line-Bot"
          git config --global user.email "bot@q-quant-888.ai"
          git add data/line_alert_state.json || true
          git diff --cached --quiet || git commit -m "chore(alert): update line alert state [skip ci]"
          git push origin main || true
