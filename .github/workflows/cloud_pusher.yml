name: 24/7 Cloud Stock Scanner & Telegram Pusher

on:
  schedule:
    # Run every 5 minutes 24/7 on GitHub Cloud Servers
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: Run 24/7 Cloud Intraday Telegram Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8616885530:AAGFvOIq5fG6INrDhDFcCNn9ljsvnej8IfE' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '7660257976' }}
        run: |
          python line_intraday_pusher.py --once || true

      - name: Commit and Push Alert State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/line_alert_state.json data/telegram_alert_state.json || true
          git diff --cached --quiet || (git commit -m "chore(alert): update alert state [skip ci]" && git push origin main)
