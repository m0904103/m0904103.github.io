name: 24/7 Automated Market Sync on GitHub Actions

on:
  schedule:
    # Run every 15 minutes 24/7 around the clock (Hits exact 09:00 TW open & 21:30 US open automatically)
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: Run Market Sync Scripts
        run: |
          python sync_regular_army_2026.py
          python scan_tw_big_data.py

      - name: Copy Results to Deployed Folders
        run: |
          cp frontend/public/scan_results.json q_quant_888/scan_results.json
          cp frontend/public/scan_results.json trading/scan_results.json
          cp frontend/public/scan_results.json scan_results.json

      - name: Commit and Push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/scan_results.json q_quant_888/scan_results.json trading/scan_results.json scan_results.json
          git diff --staged --quiet || git commit -m "🤭 [Cloud Auto-Sync] Update market quotes and scanner results [skip ci]"
          git push
