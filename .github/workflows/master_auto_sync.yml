name: 24/7 Unified Master Auto Sync & Deploy

on:
  schedule:
    # Run every 10 minutes 24/7 around the clock
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests pandas numpy

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Run Master Sync (Yahoo Finance + TWSE/TAIFEX Dual Source)
        run: python sync_regular_army_2026.py

      - name: Run Big Data Engine (TW Three-Rates & Indicators)
        run: python scan_tw_big_data.py

      - name: Build Frontend
        run: npm run build
        working-directory: frontend

      - name: Deploy and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          python upload_frontend.py
